# GenOffice ARM64 Linux Build Workflow
# 使用方法：在 Fork 的仓库中创建 .github/workflows/build-arm64.yml 文件，粘贴此内容即可

name: Build ARM64 Linux

on:
  workflow_dispatch: # 允许手动触发
    inputs:
      release_tag:
        description: Release tag to attach the ARM64 packages to
        required: true
        type: string
  release:
    types: [published] # 发布 Release 时自动触发

permissions:
  contents: write

jobs:
  build:
    name: Build on ARM64
    runs-on: ubuntu-24.04-arm # 使用 ARM64 架构的 Runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install system dependencies (FUSE + Linux package tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 libgtk-3-0 libnotify4 libnss3 \
            libxss1 libasound2t64 libdrm2 libgbm1 libxcomposite1 libxdamage1 \
            libxrandr2 fonts-liberation fonts-noto-cjk rpm cpio

      - name: Install project dependencies
        run: npm ci

      - name: Generate test fixtures
        run: npm run fixtures

      - name: Run unit tests (non-blocking)
        run: npm test
        continue-on-error: true

      - name: Build and package for Linux
        run: npm run dist:linux
        env:
          GENOFFICE_LINUX_ARCH: arm64

      - name: Validate ARM64 deb runtime metadata
        run: |
          shopt -s nullglob
          debs=(apps/shell/release/genoffice_*_arm64.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test -f "$deb"
          dpkg-deb -I "$deb" | grep -Eq 'Depends:.*libasound2'
          dpkg-deb --ctrl-tarfile "$deb" | tar -xOf - ./postinst | grep -q "chmod 4755"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: genoffice-arm64-build
          path: |
            apps/shell/release/**/*.AppImage
            apps/shell/release/**/*.deb
            apps/shell/release/**/*.rpm
          retention-days: 30

      - name: Upload to release (if released)
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            apps/shell/release/**/*.AppImage
            apps/shell/release/**/*.deb
            apps/shell/release/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
